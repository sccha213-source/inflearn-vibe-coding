<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뽀모도로 타이머</title>
  <style>
    :root {
      --bg: #17171c;
      --card: #1e1e26;
      --card-soft: #26262f;
      --text: #f1f1f4;
      --text-sub: #9a9aa5;
      --primary: #3182f6;
      --primary-hover: #1b64da;
      --focus: #3182f6;
      --rest: #00c853;
      --danger: #f04452;
      --track: #2c2c36;
      --radius: 20px;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Pretendard", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 32px 32px;
    }

    .mode-tabs {
      display: flex;
      gap: 8px;
      background: var(--card-soft);
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 32px;
    }

    .mode-tab {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 15px;
      font-weight: 600;
      padding: 12px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .mode-tab.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .label {
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .time {
      text-align: center;
      font-size: 84px;
      font-weight: 800;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      margin-bottom: 28px;
      line-height: 1;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--focus);
      border-radius: 999px;
      transition: width 0.25s linear, background 0.3s ease;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--card-soft);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #30303b;
    }

    .stats {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--card-soft);
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .stat-label {
      margin-top: 4px;
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="focus">집중</button>
      <button class="mode-tab" data-mode="rest">휴식</button>
    </div>

    <div class="label" id="label">집중할 시간이에요</div>
    <div class="time" id="time">25:00</div>

    <div class="progress-track">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">시작</button>
      <button class="btn btn-secondary" id="resetBtn">리셋</button>
    </div>

    <div class="stats">
      <div>
        <div class="stat-value" id="countValue">0개</div>
        <div class="stat-label">오늘 완료</div>
      </div>
      <div>
        <div class="stat-value" id="minutesValue">0분</div>
        <div class="stat-label">총 집중 시간</div>
      </div>
    </div>
  </div>

  <script>
    const DURATIONS = { focus: 25 * 60, rest: 5 * 60 };
    const LABELS = { focus: "집중할 시간이에요", rest: "잠깐 쉬어가요" };

    let mode = "focus";
    let remaining = DURATIONS[mode];
    let timerId = null;
    let running = false;

    let completedCount = 0;
    let totalFocusMinutes = 0;

    const timeEl = document.getElementById("time");
    const labelEl = document.getElementById("label");
    const progressEl = document.getElementById("progress");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");
    const tabs = document.querySelectorAll(".mode-tab");
    const countValue = document.getElementById("countValue");
    const minutesValue = document.getElementById("minutesValue");

    function format(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function render() {
      timeEl.textContent = format(remaining);
      labelEl.textContent = LABELS[mode];
      const total = DURATIONS[mode];
      const pct = ((total - remaining) / total) * 100;
      progressEl.style.width = pct + "%";
      progressEl.style.background =
        mode === "focus" ? "var(--focus)" : "var(--rest)";
      document.title = `${format(remaining)} · 뽀모도로`;
    }

    function updateStats() {
      countValue.textContent = completedCount + "개";
      minutesValue.textContent = totalFocusMinutes + "분";
    }

    function tick() {
      remaining--;
      if (remaining <= 0) {
        remaining = 0;
        render();
        complete();
        return;
      }
      render();
    }

    function complete() {
      stop();
      if (mode === "focus") {
        completedCount++;
        totalFocusMinutes += DURATIONS.focus / 60;
        updateStats();
        switchMode("rest");
      } else {
        switchMode("focus");
      }
      try {
        new Audio(
          "data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
        ).play();
      } catch (e) {}
    }

    function start() {
      if (running) return;
      running = true;
      startBtn.textContent = "정지";
      startBtn.classList.remove("btn-primary");
      startBtn.classList.add("btn-secondary");
      timerId = setInterval(tick, 1000);
    }

    function stop() {
      running = false;
      startBtn.textContent = "시작";
      startBtn.classList.add("btn-primary");
      startBtn.classList.remove("btn-secondary");
      clearInterval(timerId);
      timerId = null;
    }

    function reset() {
      stop();
      remaining = DURATIONS[mode];
      render();
    }

    function switchMode(next) {
      mode = next;
      remaining = DURATIONS[mode];
      tabs.forEach((t) =>
        t.classList.toggle("active", t.dataset.mode === mode)
      );
      render();
    }

    startBtn.addEventListener("click", () => {
      running ? stop() : start();
    });

    resetBtn.addEventListener("click", reset);

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        if (tab.dataset.mode === mode) return;
        stop();
        switchMode(tab.dataset.mode);
      });
    });

    updateStats();
    render();
  </script>
</body>
</html>
